<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Meter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        #strengthBar {
            width: 0%;
            height: 100%;
            transition: 0.3s;
        }

        #strengthText {
            font-weight: bold;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin: 8px 0;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Password Strength</h2>

        <input type="password" id="password"
               placeholder="Enter Password">

        <label>
            <input type="checkbox" id="showPassword">
            Show Password
        </label>

        <div class="bar">
            <div id="strengthBar"></div>
        </div>

        <p>
            Strength:
            <span id="strengthText">None</span>
        </p>

        <h3>Password Requirements</h3>

        <ul>
            <li id="rule1">At least 8 characters</li>
            <li id="rule2">One uppercase letter</li>
            <li id="rule3">One lowercase letter</li>
            <li id="rule4">One number</li>
            <li id="rule5">One special symbol</li>
        </ul>

    </div>

    <script>
        let password = document.getElementById("password");
        let showPassword = document.getElementById("showPassword");

        let strengthBar = document.getElementById("strengthBar");
        let strengthText = document.getElementById("strengthText");

        // Show or hide password
        showPassword.addEventListener("change", function() {
            if (showPassword.checked) {
                password.type = "text";
            } else {
                password.type = "password";
            }
        });

        // Check password strength
        password.addEventListener("input", function() {

            let value = password.value;
            let score = 0;

            let rules = [
                value.length >= 8,
                /[A-Z]/.test(value),
                /[a-z]/.test(value),
                /[0-9]/.test(value),
                /[^A-Za-z0-9]/.test(value)
            ];

            let ruleIds = [
                "rule1",
                "rule2",
                "rule3",
                "rule4",
                "rule5"
            ];

            // Update checklist
            rules.forEach(function(rule, index) {

                let element = document.getElementById(ruleIds[index]);

                if (rule) {
                    element.className = "valid";
                    score++;
                } else {
                    element.className = "invalid";
                }
            });

            // Update strength
            if (score === 0) {
                strengthText.innerText = "None";
                strengthBar.style.width = "0%";
                strengthBar.style.backgroundColor = "";
            }
            else if (score <= 2) {
                strengthText.innerText = "Weak";
                strengthBar.style.width = "25%";
                strengthBar.style.backgroundColor = "red";
            }
            else if (score <= 4) {
                strengthText.innerText = "Medium";
                strengthBar.style.width = "65%";
                strengthBar.style.backgroundColor = "orange";
            }
            else {
                strengthText.innerText = "Strong";
                strengthBar.style.width = "100%";
                strengthBar.style.backgroundColor = "green";
            }

        });
    </script>

</body>
</html>
